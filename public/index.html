  <link rel="stylesheet" href="/styles.css">

        <button class="btn ghost-lime" id="open-ai" data-action="open-ai">✦ AI 열기</button>
      </header>
      <main id="view" class="view"></main>
    </div>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <strong>AI 채팅</strong>
        <button class="icon-btn" data-action="close-ai" aria-label="닫기">✕</button>
      </div>
      <div class="drawer-body" id="drawer-chat"></div>
    </aside>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>

</html>
